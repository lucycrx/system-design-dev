<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architecture Review — <!-- PROJECT_NAME --></title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ========================================
   DESIGN TOKENS
   ======================================== */

:root {
  --font-body: 'DM Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'DM Mono', ui-monospace, 'Cascadia Code', monospace;

  --bg: hsl(48, 14%, 97%);
  --surface: hsl(0, 0%, 100%);
  --surface-raised: hsl(48, 10%, 95%);
  --text: hsl(0, 0%, 10%);
  --text-muted: hsl(0, 0%, 40%);
  --text-dim: hsl(0, 0%, 45%);
  --border: hsl(40, 8%, 88%);
  --border-hover: hsl(40, 8%, 78%);

  --risk-critical: hsl(4, 65%, 42%);
  --risk-critical-bg: hsl(4, 65%, 95%);
  --risk-high: hsl(24, 75%, 45%);
  --risk-high-bg: hsl(24, 75%, 95%);
  --risk-medium: hsl(42, 75%, 42%);
  --risk-medium-bg: hsl(42, 75%, 94%);
  --risk-low: hsl(210, 15%, 55%);
  --risk-low-bg: hsl(210, 15%, 95%);

  --cat-frontend: hsl(205, 35%, 47%);
  --cat-api: hsl(215, 20%, 38%);
  --cat-database: hsl(145, 35%, 32%);
  --cat-cache: hsl(42, 65%, 44%);
  --cat-auth: hsl(0, 35%, 40%);
  --cat-external: hsl(8, 60%, 48%);
  --cat-jobs: hsl(270, 25%, 45%);
  --cat-storage: hsl(140, 20%, 40%);

  --max-width: 1280px;
}

/* ========================================
   RESET & BASE
   ======================================== */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  line-height: 1.55;
}

.shell {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 2rem 4rem;
}

/* ========================================
   HEADER
   ======================================== */

.header {
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  padding: 1.25rem 2rem;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-inner {
  max-width: var(--max-width);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2rem;
}

.header-left {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  min-width: 0;
}

.project-name {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text);
  white-space: nowrap;
}

.project-meta {
  font-size: 0.8rem;
  color: var(--text-dim);
  white-space: nowrap;
}

.risk-counts {
  display: flex;
  gap: 0.5rem;
  flex-shrink: 0;
}

.risk-chip {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.25rem 0.6rem;
  border: 1px solid;
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.risk-chip[data-severity="critical"] { color: var(--risk-critical); border-color: var(--risk-critical); background: var(--risk-critical-bg); }
.risk-chip[data-severity="high"] { color: var(--risk-high); border-color: var(--risk-high); background: var(--risk-high-bg); }
.risk-chip[data-severity="medium"] { color: var(--risk-medium); border-color: var(--risk-medium); background: var(--risk-medium-bg); }
.risk-chip[data-severity="low"] { color: var(--risk-low); border-color: var(--risk-low); background: var(--risk-low-bg); }

.risk-chip .count { font-weight: 700; font-size: 0.85rem; }

/* ========================================
   SUMMARY STRIP
   ======================================== */

.summary-strip {
  padding: 1.5rem 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2rem;
}

.summary-text {
  font-size: 1.05rem;
  line-height: 1.6;
  color: var(--text);
  max-width: 48rem;
}

.summary-text strong { font-weight: 600; }

.section-label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 1rem;
}

/* ========================================
   ARCHITECTURE DIAGRAM
   Positioned nodes with SVG connections
   ======================================== */

.map-section { margin-bottom: 3rem; }

.architecture-map {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  overflow: visible;
}

/* SVG connection layer */
.connection-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.conn-path {
  fill: none;
  stroke: var(--border-hover);
  stroke-width: 1.5;
  transition: stroke 0.2s ease, stroke-width 0.2s ease, opacity 0.2s ease;
}

.conn-path.highlighted {
  stroke: var(--text-muted);
  stroke-width: 2;
}

.conn-path.dimmed {
  opacity: 0.15;
}

.conn-arrowhead {
  fill: var(--border-hover);
  transition: fill 0.2s ease, opacity 0.2s ease;
}

.conn-arrowhead.highlighted { fill: var(--text-muted); }
.conn-arrowhead.dimmed { opacity: 0.15; }

.conn-label-text {
  font-family: var(--font-mono);
  font-size: 9px;
  fill: var(--text-dim);
  letter-spacing: 0.03em;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.conn-label-text.dimmed { opacity: 0.1; }

/* Diagram nodes — absolutely positioned */
.diagram-node {
  position: absolute;
  z-index: 2;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 0.85rem 1rem;
  cursor: pointer;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
  min-width: 160px;
  max-width: 220px;
}

.diagram-node:hover {
  border-color: var(--border-hover);
  z-index: 3;
}

.diagram-node.selected {
  border-color: var(--text-muted);
  box-shadow: 0 0 0 1px var(--text-muted);
  z-index: 4;
}

.diagram-node.dimmed {
  opacity: 0.25;
}

/* Risk left-border on nodes */
.diagram-node.risk-critical { border-left: 3px solid var(--risk-critical); }
.diagram-node.risk-high { border-left: 3px solid var(--risk-high); }
.diagram-node.risk-medium { border-left: 3px solid var(--risk-medium); }
.diagram-node.risk-low { border-left: 3px solid var(--risk-low); }

.node-category {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  display: inline-block;
  padding: 0.05rem 0.35rem;
  color: white;
  margin-bottom: 0.3rem;
}

.node-category[data-cat="frontend"] { background: var(--cat-frontend); }
.node-category[data-cat="api-layer"] { background: var(--cat-api); }
.node-category[data-cat="database"] { background: var(--cat-database); }
.node-category[data-cat="cache"] { background: var(--cat-cache); color: var(--text); }
.node-category[data-cat="auth"] { background: var(--cat-auth); }
.node-category[data-cat="external-services"] { background: var(--cat-external); }
.node-category[data-cat="background-jobs"] { background: var(--cat-jobs); }
.node-category[data-cat="storage"] { background: var(--cat-storage); }

.node-label {
  font-size: 0.85rem;
  font-weight: 600;
  line-height: 1.3;
}

.node-sublabel {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-top: 0.15rem;
  line-height: 1.35;
}

/* Risk dot */
.risk-dot {
  position: absolute;
  top: 0.6rem;
  right: 0.6rem;
  width: 7px;
  height: 7px;
}

.risk-dot.critical { background: var(--risk-critical); }
.risk-dot.high { background: var(--risk-high); }
.risk-dot.medium { background: var(--risk-medium); }
.risk-dot.low { background: var(--risk-low); }

/* ========================================
   DETAIL PANEL — below diagram
   ======================================== */

.detail-panel {
  display: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: none;
  padding: 1.5rem;
}

.detail-panel.visible { display: block; }

.detail-panel-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 0.75rem;
}

.detail-close {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-dim);
  cursor: pointer;
  border: 1px solid var(--border);
  background: none;
  padding: 0.2rem 0.5rem;
  transition: border-color 0.15s ease;
}

.detail-close:hover { border-color: var(--text-muted); }

.detail-title { font-size: 1.05rem; font-weight: 600; }

.detail-description {
  font-size: 0.88rem;
  line-height: 1.6;
  color: var(--text-muted);
  margin-bottom: 1rem;
  max-width: 48rem;
}

.detail-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
}

.detail-files-title,
.detail-connections-title {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 0.4rem;
}

.detail-file {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-muted);
  padding: 0.15rem 0;
}

.detail-connection {
  font-size: 0.82rem;
  color: var(--text-muted);
  padding: 0.2rem 0;
}

.detail-connection-target { font-weight: 500; color: var(--text); }

/* ========================================
   RISK REPORT
   ======================================== */

.risk-section { margin-bottom: 3rem; }

.risk-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
}

.risk-card {
  background: var(--surface);
  cursor: pointer;
  transition: background 0.15s ease;
}

.risk-card:hover { background: var(--surface-raised); }

.risk-card-header {
  display: grid;
  grid-template-columns: 5rem 1fr auto;
  align-items: center;
  padding: 1rem 1.25rem;
  gap: 1rem;
}

.risk-severity {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.25rem 0;
  text-align: center;
  border: 1px solid;
}

.risk-severity.critical { color: var(--risk-critical); border-color: var(--risk-critical); background: var(--risk-critical-bg); }
.risk-severity.high { color: var(--risk-high); border-color: var(--risk-high); background: var(--risk-high-bg); }
.risk-severity.medium { color: var(--risk-medium); border-color: var(--risk-medium); background: var(--risk-medium-bg); }
.risk-severity.low { color: var(--risk-low); border-color: var(--risk-low); background: var(--risk-low-bg); }

.risk-title { font-size: 0.92rem; font-weight: 500; }

.risk-toggle {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-dim);
  transition: transform 0.2s ease;
}

.risk-card.expanded .risk-toggle { transform: rotate(90deg); }

.risk-detail {
  display: none;
  padding: 0 1.25rem 1.5rem;
  padding-left: calc(5rem + 1.25rem + 1rem);
}

.risk-card.expanded .risk-detail { display: block; }

.risk-analogy {
  font-size: 0.85rem;
  line-height: 1.55;
  color: var(--text-muted);
  border-left: 2px solid var(--border);
  padding-left: 1rem;
  margin: 0.5rem 0 0.75rem;
  font-style: italic;
}

.risk-consequence {
  font-size: 0.85rem;
  color: var(--text-muted);
  line-height: 1.5;
  margin-bottom: 0.75rem;
}

.risk-evidence {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-dim);
  background: var(--surface-raised);
  border: 1px solid var(--border);
  padding: 0.6rem 0.8rem;
  margin-top: 0.75rem;
  line-height: 1.5;
}

.risk-fix {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  padding: 1rem;
  margin-top: 1rem;
}

.risk-fix-title {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 0.5rem;
}

.risk-fix-summary { font-size: 0.88rem; font-weight: 600; margin-bottom: 0.35rem; }

.risk-fix-detail { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }

.risk-meta {
  display: flex;
  gap: 2rem;
  margin-top: 1rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--border);
}

.risk-meta-label {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  display: block;
  margin-bottom: 0.2rem;
}

.risk-meta-value { color: var(--text-muted); font-size: 0.78rem; }

.risk-learn-more {
  margin-top: 0.75rem;
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.learn-more-link {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.05em;
  color: var(--cat-frontend);
  text-decoration: none;
  border: 1px solid var(--border);
  padding: 0.2rem 0.5rem;
  transition: border-color 0.15s ease;
}

.learn-more-link:hover { border-color: var(--cat-frontend); }

/* ========================================
   FOOTER
   ======================================== */

.footer {
  padding-top: 2rem;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.footer-left {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
}

.footer-right { font-size: 0.78rem; color: var(--text-dim); }
.footer-right a { color: var(--cat-frontend); text-decoration: none; }
.footer-right a:hover { text-decoration: underline; }

/* ========================================
   ANIMATIONS
   ======================================== */

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.diagram-node { animation: fadeIn 0.3s ease-out both; }
.risk-card { animation: fadeIn 0.3s ease-out both; }

.risk-list .risk-card:nth-child(1) { animation-delay: 0.1s; }
.risk-list .risk-card:nth-child(2) { animation-delay: 0.15s; }
.risk-list .risk-card:nth-child(3) { animation-delay: 0.2s; }
.risk-list .risk-card:nth-child(4) { animation-delay: 0.25s; }
.risk-list .risk-card:nth-child(5) { animation-delay: 0.3s; }
.risk-list .risk-card:nth-child(6) { animation-delay: 0.35s; }

/* ========================================
   RESPONSIVE
   ======================================== */

@media (max-width: 768px) {
  .header-inner { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
  .risk-card-header { grid-template-columns: auto 1fr auto; gap: 0.75rem; }
  .risk-detail { padding-left: 1.25rem; }
  .risk-meta { flex-direction: column; gap: 0.75rem; }
  .detail-columns { grid-template-columns: 1fr; }
  .footer { flex-direction: column; gap: 0.5rem; }
  .architecture-map { overflow-x: auto; }
}

/* ========================================
   PRINT
   ======================================== */

@media print {
  .header { position: static; border-bottom: 2px solid var(--text); }
  .diagram-node, .risk-card { animation: none; break-inside: avoid; }
  .risk-card .risk-detail { display: block; }
  .risk-toggle, .detail-close { display: none; }
  body { background: white; }
  .architecture-map { border: 2px solid var(--text); }
}

@media (prefers-reduced-motion: reduce) {
  .diagram-node, .risk-card { animation: none; }
  * { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-left">
      <span class="project-name" id="projectName"></span>
      <span class="project-meta" id="projectMeta"></span>
    </div>
    <div class="risk-counts" id="riskCounts"></div>
  </div>
</header>

<div class="shell">
  <div class="summary-strip">
    <p class="summary-text" id="summaryText"></p>
  </div>

  <section class="map-section">
    <div class="section-label">Architecture Diagram</div>
    <div class="architecture-map" id="archMap">
      <svg class="connection-layer" id="connLayer"></svg>
    </div>
    <div class="detail-panel" id="detailPanel">
      <div class="detail-panel-header">
        <div>
          <span class="node-category" id="detailCategory"></span>
          <h2 class="detail-title" id="detailTitle"></h2>
        </div>
        <button class="detail-close" onclick="closeDetail()">close</button>
      </div>
      <p class="detail-description" id="detailDescription"></p>
      <div class="detail-columns">
        <div id="detailFiles"></div>
        <div id="detailConnections"></div>
      </div>
    </div>
  </section>

  <section class="risk-section">
    <div class="section-label">Risk Report</div>
    <div class="risk-list" id="riskList"></div>
  </section>

  <footer class="footer">
    <div class="footer-left" id="footerTimestamp"></div>
    <div class="footer-right">
      Generated by <a href="https://systemdesignschool.com" target="_blank" rel="noopener">System Design for Builders</a>
    </div>
  </footer>
</div>

<script id="architectureData" type="application/json">
<!-- ARCHITECTURE_DATA -->
</script>

<script>
(function() {
  'use strict';

  var dataEl = document.getElementById('architectureData');
  var data;
  try { data = JSON.parse(dataEl.textContent); }
  catch(e) {
    document.body.innerHTML = '<div style="padding:3rem;font-family:system-ui"><h1>No architecture data found</h1><p>This template needs architecture data injected by the skill.</p></div>';
    return;
  }

  var meta = data.metadata;
  var components = data.components || [];
  var risks = data.risks || [];

  // Lookups
  var componentRiskMap = {};
  var severityOrder = { critical: 0, high: 1, medium: 2, low: 3 };
  risks.forEach(function(r) {
    var sev = r.adjustedSeverity || r.severity;
    (r.affectedComponents || []).forEach(function(cid) {
      if (!componentRiskMap[cid] || severityOrder[sev] < severityOrder[componentRiskMap[cid]])
        componentRiskMap[cid] = sev;
    });
  });

  var compMap = {};
  var compLabelMap = {};
  components.forEach(function(c) {
    compMap[c.id] = c;
    compLabelMap[c.id] = c.label;
  });

  // ---- HEADER ----
  document.getElementById('projectName').textContent = meta.projectName || 'Project';
  document.getElementById('projectMeta').textContent =
    (meta.framework || '') + (meta.language ? ' / ' + meta.language : '') +
    ' / ' + (meta.scaleAssessment || 'unknown') + ' scale';

  var countsEl = document.getElementById('riskCounts');
  var rc = meta.riskCount || {};
  ['critical','high','medium','low'].forEach(function(sev) {
    var count = rc[sev] || 0;
    if (!count) return;
    var chip = document.createElement('span');
    chip.className = 'risk-chip';
    chip.setAttribute('data-severity', sev);
    chip.innerHTML = '<span class="count">' + count + '</span> ' + sev;
    countsEl.appendChild(chip);
  });

  // ---- SUMMARY ----
  var total = (rc.critical||0)+(rc.high||0)+(rc.medium||0)+(rc.low||0);
  var s = '<strong>' + esc(meta.projectName||'This project') + '</strong>';
  s += ' is a ' + esc(meta.framework||'web') + ' application';
  s += ' with <strong>' + components.length + ' components</strong>';
  if (total > 0) {
    s += ' and <strong>' + total + ' identified risk' + (total!==1?'s':'') + '</strong>';
    if (rc.critical > 0) s += ', including ' + rc.critical + ' critical';
  } else {
    s += ' and no significant risks identified at its current scale';
  }
  s += '.';
  document.getElementById('summaryText').innerHTML = s;

  // ============================================
  // ARCHITECTURE DIAGRAM — layered layout
  // ============================================

  var mapEl = document.getElementById('archMap');
  var svgEl = document.getElementById('connLayer');

  // Build adjacency: who does this component connect TO?
  var outEdges = {};  // id -> [{targetId, label}]
  var inDegree = {};  // id -> count of incoming
  components.forEach(function(c) {
    outEdges[c.id] = c.connections || [];
    if (!(c.id in inDegree)) inDegree[c.id] = 0;
    (c.connections||[]).forEach(function(conn) {
      inDegree[conn.targetId] = (inDegree[conn.targetId]||0) + 1;
    });
  });

  // Assign layers via longest-path from roots (nodes with no incoming edges)
  var layer = {};
  var visited = {};

  function assignLayer(id, depth) {
    if (visited[id] && layer[id] >= depth) return;
    visited[id] = true;
    layer[id] = Math.max(layer[id] || 0, depth);
    (outEdges[id]||[]).forEach(function(e) {
      assignLayer(e.targetId, depth + 1);
    });
  }

  // Start from nodes with no incoming edges
  components.forEach(function(c) {
    if ((inDegree[c.id]||0) === 0) assignLayer(c.id, 0);
  });
  // Handle any unvisited (cycles or disconnected)
  components.forEach(function(c) {
    if (!visited[c.id]) layer[c.id] = 0;
  });

  // Group by layer
  var layers = {};
  var maxLayer = 0;
  components.forEach(function(c) {
    var l = layer[c.id];
    if (l > maxLayer) maxLayer = l;
    if (!layers[l]) layers[l] = [];
    layers[l].push(c);
  });

  // Layout constants
  var NODE_W = 200;
  var NODE_H = 72;
  var PAD_X = 48;
  var PAD_Y = 36;
  var LAYER_GAP = 100;
  var NODE_GAP = 28;

  // Calculate positions
  var positions = {}; // id -> {x, y, w, h}
  var totalHeight = 0;

  // Find the widest layer to set the diagram width
  var maxLayerWidth = 0;
  for (var l = 0; l <= maxLayer; l++) {
    var row = layers[l] || [];
    var rowW = row.length * NODE_W + (row.length - 1) * NODE_GAP;
    if (rowW > maxLayerWidth) maxLayerWidth = rowW;
  }
  var diagramWidth = Math.max(maxLayerWidth + PAD_X * 2, 700);

  for (var l = 0; l <= maxLayer; l++) {
    var row = layers[l] || [];
    var rowW = row.length * NODE_W + (row.length - 1) * NODE_GAP;
    var startX = (diagramWidth - rowW) / 2;
    var y = PAD_Y + l * (NODE_H + LAYER_GAP);

    row.forEach(function(c, i) {
      positions[c.id] = {
        x: startX + i * (NODE_W + NODE_GAP),
        y: y,
        w: NODE_W,
        h: NODE_H
      };
    });

    totalHeight = y + NODE_H;
  }

  totalHeight += PAD_Y;
  mapEl.style.height = totalHeight + 'px';
  mapEl.style.minWidth = diagramWidth + 'px';
  svgEl.setAttribute('width', diagramWidth);
  svgEl.setAttribute('height', totalHeight);
  svgEl.setAttribute('viewBox', '0 0 ' + diagramWidth + ' ' + totalHeight);

  // Render nodes
  var nodeEls = {};
  components.forEach(function(comp, idx) {
    var pos = positions[comp.id];
    var node = document.createElement('div');
    node.className = 'diagram-node';
    node.setAttribute('data-id', comp.id);
    node.style.left = pos.x + 'px';
    node.style.top = pos.y + 'px';
    node.style.width = pos.w + 'px';
    node.style.animationDelay = (idx * 0.06) + 's';

    var riskSev = componentRiskMap[comp.id];
    if (riskSev) node.classList.add('risk-' + riskSev);

    var h = '';
    if (riskSev) h += '<div class="risk-dot ' + riskSev + '"></div>';
    h += '<span class="node-category" data-cat="' + esc(comp.category) + '">' + esc(comp.category.replace(/-/g,' ')) + '</span>';
    h += '<div class="node-label">' + esc(comp.label.split('(')[0].trim()) + '</div>';
    // Short sublabel from the part in parentheses, if present
    var paren = comp.label.match(/\(([^)]+)\)/);
    if (paren) h += '<div class="node-sublabel">' + esc(paren[1]) + '</div>';

    node.innerHTML = h;
    node.addEventListener('click', function() { selectComponent(comp); });
    node.addEventListener('mouseenter', function() { highlightConnections(comp.id); });
    node.addEventListener('mouseleave', function() { clearHighlight(); });
    mapEl.appendChild(node);
    nodeEls[comp.id] = node;
  });

  // Render connections as SVG paths
  var connEls = []; // {path, arrow, label, sourceId, targetId}

  components.forEach(function(comp) {
    (comp.connections||[]).forEach(function(conn) {
      var from = positions[comp.id];
      var to = positions[conn.targetId];
      if (!from || !to) return;

      // Calculate connection points: bottom-center of source -> top-center of target
      var x1 = from.x + from.w / 2;
      var y1 = from.y + from.h;
      var x2 = to.x + to.w / 2;
      var y2 = to.y;

      // If on same layer, connect side-to-side
      if (layer[comp.id] === layer[conn.targetId]) {
        if (from.x < to.x) {
          x1 = from.x + from.w;
          y1 = from.y + from.h / 2;
          x2 = to.x;
          y2 = to.y + to.h / 2;
        } else {
          x1 = from.x;
          y1 = from.y + from.h / 2;
          x2 = to.x + to.w;
          y2 = to.y + to.h / 2;
        }
      }

      // Cubic bezier for smooth curves
      var dx = x2 - x1;
      var dy = y2 - y1;
      var cx1, cy1, cx2, cy2;

      if (layer[comp.id] === layer[conn.targetId]) {
        // Horizontal: curve outward
        cx1 = x1 + dx * 0.4;
        cy1 = y1;
        cx2 = x2 - dx * 0.4;
        cy2 = y2;
      } else {
        // Vertical: smooth S-curve
        cx1 = x1;
        cy1 = y1 + Math.abs(dy) * 0.4;
        cx2 = x2;
        cy2 = y2 - Math.abs(dy) * 0.4;
      }

      var pathD = 'M' + x1 + ',' + y1 + ' C' + cx1 + ',' + cy1 + ' ' + cx2 + ',' + cy2 + ' ' + x2 + ',' + y2;

      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathD);
      path.setAttribute('class', 'conn-path');
      path.setAttribute('data-source', comp.id);
      path.setAttribute('data-target', conn.targetId);
      svgEl.appendChild(path);

      // Arrowhead at target end
      var angle = Math.atan2(y2 - cy2, x2 - cx2);
      var arrowSize = 6;
      var ax1 = x2 - arrowSize * Math.cos(angle - 0.4);
      var ay1 = y2 - arrowSize * Math.sin(angle - 0.4);
      var ax2 = x2 - arrowSize * Math.cos(angle + 0.4);
      var ay2 = y2 - arrowSize * Math.sin(angle + 0.4);

      var arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      arrow.setAttribute('points', x2+','+y2 + ' ' + ax1+','+ay1 + ' ' + ax2+','+ay2);
      arrow.setAttribute('class', 'conn-arrowhead');
      svgEl.appendChild(arrow);

      // Connection label at midpoint
      var mx = (x1 + x2) / 2;
      var my = (y1 + y2) / 2;
      if (conn.label) {
        var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', mx);
        text.setAttribute('y', my - 6);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('class', 'conn-label-text');
        // Truncate long labels
        var lbl = conn.label.length > 30 ? conn.label.substring(0, 28) + '...' : conn.label;
        text.textContent = lbl;
        svgEl.appendChild(text);
      }

      connEls.push({ path: path, arrow: arrow, sourceId: comp.id, targetId: conn.targetId });
    });
  });

  // ---- Hover: highlight connections ----
  function highlightConnections(compId) {
    // Find all connected IDs (both directions)
    var connected = {};
    connected[compId] = true;
    connEls.forEach(function(c) {
      if (c.sourceId === compId) connected[c.targetId] = true;
      if (c.targetId === compId) connected[c.sourceId] = true;
    });

    // Dim unconnected nodes
    components.forEach(function(c) {
      if (!connected[c.id]) nodeEls[c.id].classList.add('dimmed');
      else nodeEls[c.id].classList.remove('dimmed');
    });

    // Highlight/dim connections
    connEls.forEach(function(c) {
      var isConn = (c.sourceId === compId || c.targetId === compId);
      c.path.classList.toggle('highlighted', isConn);
      c.path.classList.toggle('dimmed', !isConn);
      c.arrow.classList.toggle('highlighted', isConn);
      c.arrow.classList.toggle('dimmed', !isConn);
    });

    // Dim labels
    svgEl.querySelectorAll('.conn-label-text').forEach(function(t) {
      var parent = t.previousElementSibling;
      // Check if any highlighted path is near this label
      t.classList.add('dimmed');
    });
    connEls.forEach(function(c) {
      if (c.sourceId === compId || c.targetId === compId) {
        // Find the label text after this path's arrow
        var next = c.arrow.nextElementSibling;
        if (next && next.classList.contains('conn-label-text')) {
          next.classList.remove('dimmed');
        }
      }
    });
  }

  function clearHighlight() {
    components.forEach(function(c) { nodeEls[c.id].classList.remove('dimmed'); });
    connEls.forEach(function(c) {
      c.path.classList.remove('highlighted', 'dimmed');
      c.arrow.classList.remove('highlighted', 'dimmed');
    });
    svgEl.querySelectorAll('.conn-label-text').forEach(function(t) { t.classList.remove('dimmed'); });
  }

  // ---- DETAIL PANEL ----
  var detailPanel = document.getElementById('detailPanel');
  var selectedId = null;

  function selectComponent(comp) {
    if (selectedId === comp.id) { closeDetail(); return; }

    if (selectedId && nodeEls[selectedId]) nodeEls[selectedId].classList.remove('selected');
    selectedId = comp.id;
    nodeEls[comp.id].classList.add('selected');

    document.getElementById('detailCategory').setAttribute('data-cat', comp.category);
    document.getElementById('detailCategory').textContent = comp.category.replace(/-/g,' ');
    document.getElementById('detailTitle').textContent = comp.label;
    document.getElementById('detailDescription').textContent = comp.description;

    var filesEl = document.getElementById('detailFiles');
    if (comp.files && comp.files.length) {
      filesEl.innerHTML = '<div class="detail-files-title">Key Files</div>' +
        comp.files.map(function(f) { return '<div class="detail-file">' + esc(f) + '</div>'; }).join('');
    } else { filesEl.innerHTML = ''; }

    var connsEl = document.getElementById('detailConnections');
    if (comp.connections && comp.connections.length) {
      connsEl.innerHTML = '<div class="detail-connections-title">Connects To</div>' +
        comp.connections.map(function(c) {
          return '<div class="detail-connection"><span class="detail-connection-target">' + esc(compLabelMap[c.targetId]||c.targetId) + '</span> &mdash; ' + esc(c.label) + '</div>';
        }).join('');
    } else { connsEl.innerHTML = ''; }

    detailPanel.classList.add('visible');
  }

  window.closeDetail = function() {
    if (selectedId && nodeEls[selectedId]) nodeEls[selectedId].classList.remove('selected');
    selectedId = null;
    detailPanel.classList.remove('visible');
  };

  // ---- RISK REPORT ----
  var riskListEl = document.getElementById('riskList');
  var sortedRisks = risks.slice().sort(function(a,b) {
    return (severityOrder[a.adjustedSeverity||a.severity]||99) - (severityOrder[b.adjustedSeverity||b.severity]||99);
  });

  sortedRisks.forEach(function(risk) {
    var sev = risk.adjustedSeverity || risk.severity;
    var card = document.createElement('div');
    card.className = 'risk-card';

    var hdr = '<div class="risk-card-header">';
    hdr += '<span class="risk-severity ' + esc(sev) + '">' + esc(sev) + '</span>';
    hdr += '<span class="risk-title">' + esc(risk.explanation.plain) + '</span>';
    hdr += '<span class="risk-toggle">&#9654;</span></div>';

    var det = '<div class="risk-detail">';
    det += '<div class="risk-analogy">' + esc(risk.explanation.analogy) + '</div>';
    det += '<p class="risk-consequence">' + esc(risk.explanation.consequence) + '</p>';
    if (risk.evidence) det += '<div class="risk-evidence">' + esc(risk.evidence) + '</div>';
    if (risk.fix) {
      det += '<div class="risk-fix"><div class="risk-fix-title">Recommended Fix</div>';
      det += '<div class="risk-fix-summary">' + esc(risk.fix.summary) + '</div>';
      det += '<div class="risk-fix-detail">' + esc(risk.fix.detail) + '</div></div>';
    }
    det += '<div class="risk-meta">';
    if (risk.affectedComponents && risk.affectedComponents.length) {
      det += '<div><span class="risk-meta-label">Affected</span>';
      det += '<span class="risk-meta-value">' + risk.affectedComponents.map(function(id) { return esc(compLabelMap[id]||id); }).join(', ') + '</span></div>';
    }
    det += '</div>';
    if (risk.learnMore) {
      var links = [];
      (risk.learnMore.glossaryTerms||[]).forEach(function(t) {
        links.push('<a class="learn-more-link" href="https://systemdesignschool.com/glossary#' + esc(t) + '" target="_blank" rel="noopener">' + esc(t.replace(/-/g,' ')) + '</a>');
      });
      if (risk.learnMore.buildStory && risk.learnMore.buildStory.slug)
        links.push('<a class="learn-more-link" href="https://systemdesignschool.com/stories/' + esc(risk.learnMore.buildStory.slug) + '" target="_blank" rel="noopener">Build Story: ' + esc(risk.learnMore.buildStory.slug.replace(/-/g,' ')) + '</a>');
      if (links.length) det += '<div class="risk-learn-more">' + links.join('') + '</div>';
    }
    det += '</div>';

    card.innerHTML = hdr + det;
    card.querySelector('.risk-card-header').addEventListener('click', function() { card.classList.toggle('expanded'); });
    riskListEl.appendChild(card);
  });

  // ---- FOOTER ----
  var ts = meta.scannedAt ? new Date(meta.scannedAt).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
  document.getElementById('footerTimestamp').textContent = 'Scanned ' + ts;

  function esc(str) {
    if (!str) return '';
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

})();
</script>
</body>
</html>
